<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广播消息</title>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-secondary: #666666;
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --success: #2e7d32;
      --error: #d32f2f;
      --disabled: #9e9e9e;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --surface: #1e1e1e;
      --border: #333333;
      --text: #e0e0e0;
      --text-secondary: #aaaaaa;
      --primary: #90caf9;
      --primary-hover: #64b5f6;
      --success: #81c784;
      --error: #ef5350;
      --disabled: #666666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .target-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .target-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .target-item:hover { border-color: var(--primary); }
    .target-item.selected {
      background: color-mix(in srgb, var(--primary) 15%, var(--surface));
      border-color: var(--primary);
    }
    .target-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .target-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }
    .target-name { font-size: 0.9rem; }
    .target-id { font-size: 0.75rem; color: var(--text-secondary); }
    .target-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-secondary);
    }
    .message-area {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
    }
    .message-area:focus {
      outline: none;
      border-color: var(--primary);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }
    .btn-select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .btn-select:hover { border-color: var(--primary); color: var(--primary); }
    .status {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
    .results {
      margin-top: 16px;
      padding: 12px;
      background: var(--surface);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .result-icon { font-size: 1rem; }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>广播消息</h1>

  <div class="section">
    <div class="section-title">
      选择目标
      <button class="btn btn-select" onclick="selectAll()">全选</button>
      <button class="btn btn-select" onclick="selectNone()">清空</button>
      <button class="btn btn-select" onclick="selectFriends()">仅好友</button>
      <button class="btn btn-select" onclick="selectGroups()">仅群聊</button>
    </div>
    <div id="targets" class="target-list">
      <div class="loading"></div>
      <span>加载中...</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">消息内容</div>
    <textarea id="message" class="message-area" placeholder="输入要发送的消息..."></textarea>
  </div>

  <div class="actions">
    <button id="sendBtn" class="btn btn-primary" onclick="sendBroadcast()" disabled>发送</button>
    <span id="status" class="status"></span>
  </div>

  <div id="results" class="results" style="display: none;"></div>

  <script>
    const bridge = window.AstrBotPluginView;
    let targets = { friends: [], groups: [] };
    let selected = new Set();

    bridge.ready().then(async () => {
      try {
        const data = await bridge.apiGet("targets");
        targets = data;
        renderTargets();
      } catch (err) {
        document.getElementById("targets").innerHTML =
          '<span style="color:var(--error)">加载失败: ' + err.message + '</span>';
      }
    });

    function renderTargets() {
      const container = document.getElementById("targets");
      let html = "";

      for (const f of targets.friends || []) {
        const key = "friend:" + f.id;
        const sel = selected.has(key) ? "selected" : "";
        html += `<label class="target-item ${sel}" data-key="${key}">
          <input type="checkbox" ${sel ? "checked" : ""} onchange="toggle('${key}')">
          <span class="target-name">${esc(f.name)}</span>
          <span class="target-id">${f.id}</span>
          <span class="target-badge">好友</span>
        </label>`;
      }

      for (const g of targets.groups || []) {
        const key = "group:" + g.id;
        const sel = selected.has(key) ? "selected" : "";
        const dis = g.enabled === false ? "disabled" : "";
        html += `<label class="target-item ${sel} ${dis}" data-key="${key}">
          <input type="checkbox" ${sel ? "checked" : ""} ${dis ? "disabled" : ""} onchange="toggle('${key}')">
          <span class="target-name">${esc(g.name)}</span>
          <span class="target-id">${g.id}</span>
          <span class="target-badge">群聊${g.enabled === false ? " (已禁用)" : ""}</span>
        </label>`;
      }

      container.innerHTML = html || '<span style="color:var(--text-secondary)">暂无目标</span>';
      updateSendButton();
    }

    function toggle(key) {
      if (selected.has(key)) {
        selected.delete(key);
      } else {
        selected.add(key);
      }
      renderTargets();
    }

    function selectAll() {
      selected.clear();
      for (const f of targets.friends || []) selected.add("friend:" + f.id);
      for (const g of targets.groups || []) {
        if (g.enabled !== false) selected.add("group:" + g.id);
      }
      renderTargets();
    }

    function selectNone() {
      selected.clear();
      renderTargets();
    }

    function selectFriends() {
      selected.clear();
      for (const f of targets.friends || []) selected.add("friend:" + f.id);
      renderTargets();
    }

    function selectGroups() {
      selected.clear();
      for (const g of targets.groups || []) {
        if (g.enabled !== false) selected.add("group:" + g.id);
      }
      renderTargets();
    }

    function updateSendButton() {
      const msg = document.getElementById("message").value.trim();
      document.getElementById("sendBtn").disabled = selected.size === 0 || !msg;
    }

    document.getElementById("message").addEventListener("input", updateSendButton);

    async function sendBroadcast() {
      const btn = document.getElementById("sendBtn");
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      const msg = document.getElementById("message").value.trim();
      if (!msg || selected.size === 0) return;

      const targetList = [];
      for (const key of selected) {
        const [type, id] = key.split(":");
        targetList.push({ type, id });
      }

      btn.disabled = true;
      status.className = "status";
      status.textContent = "发送中...";
      results.style.display = "none";

      try {
        const resp = await bridge.apiPost("send", {
          targets: targetList,
          message: msg,
        });

        if (resp.success) {
          status.className = "status success";
          status.textContent = `已发送 ${resp.sent}/${resp.total}`;
          renderResults(resp.results);
        } else {
          status.className = "status error";
          status.textContent = "发送失败: " + (resp.error || "未知错误");
        }
      } catch (err) {
        status.className = "status error";
        status.textContent = "发送失败: " + err.message;
      }

      btn.disabled = false;
      updateSendButton();
    }

    function renderResults(results) {
      const container = document.getElementById("results");
      let html = '<div class="section-title">发送结果</div>';
      for (const r of results || []) {
        const icon = r.success ? "✓" : "✗";
        const color = r.success ? "var(--success)" : "var(--error)";
        const err = r.error ? " (" + esc(r.error) + ")" : "";
        html += `<div class="result-item">
          <span class="result-icon" style="color:${color}">${icon}</span>
          <span>${esc(r.id)}${err}</span>
        </div>`;
      }
      container.innerHTML = html;
      container.style.display = "block";
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }
  </script>
</body>
</html>
