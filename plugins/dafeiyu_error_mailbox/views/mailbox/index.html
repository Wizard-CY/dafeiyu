<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报错待办</title>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <style>
    :root {
      --bg: #ffffff; --surface: #f8f9fa; --border: #e0e0e0;
      --text: #1a1a1a; --text2: #666666; --text3: #999999;
      --info: #1976d2; --warning: #f57c00; --error: #d32f2f; --critical: #b71c1c;
      --info-bg: #e3f2fd; --warning-bg: #fff3e0; --error-bg: #ffebee; --critical-bg: #ffcdd2;
      --unread-bg: #f0f7ff; --hover: #f5f5f5;
    }
    [data-theme="dark"] {
      --bg: #121212; --surface: #1e1e1e; --border: #333;
      --text: #e0e0e0; --text2: #aaa; --text3: #777;
      --info: #90caf9; --warning: #ffb74d; --error: #ef5350; --critical: #e53935;
      --info-bg: #1a237e33; --warning-bg: #e65100aa; --error-bg: #b71c1caa; --critical-bg: #880e0eaa;
      --unread-bg: #1a2744; --hover: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
    .badge { background: var(--error); color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.8rem; }
    .btn:hover { background: var(--hover); }
    .btn-danger { border-color: var(--error); color: var(--error); }
    .btn-danger:hover { background: var(--error-bg); }

    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    .incident-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .incident { display: grid; grid-template-columns: 4px 32px 1fr auto; gap: 10px; align-items: start; padding: 12px 14px; background: var(--bg); cursor: pointer; transition: background 0.15s; }
    .incident:hover { background: var(--hover); }
    .incident.unread { background: var(--unread-bg); font-weight: 500; }
    .incident.unread:hover { background: var(--hover); }

    .severity-bar { width: 4px; height: 100%; min-height: 36px; border-radius: 2px; }
    .severity-bar.info { background: var(--info); }
    .severity-bar.warning { background: var(--warning); }
    .severity-bar.error { background: var(--error); }
    .severity-bar.critical { background: var(--critical); }

    .type-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .type-icon.defense_trigger { background: var(--critical-bg); }
    .type-icon.plugin_error { background: var(--error-bg); }
    .type-icon.llm_failure { background: var(--warning-bg); }
    .type-icon.content_guard { background: var(--info-bg); }
    .type-icon.connection_issue { background: var(--warning-bg); }

    .incident-body { min-width: 0; }
    .incident-title { font-size: 0.9rem; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .incident-meta { font-size: 0.75rem; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; }
    .incident-detail { font-size: 0.8rem; color: var(--text2); margin-top: 6px; padding: 8px; background: var(--surface); border-radius: 4px; white-space: pre-wrap; word-break: break-all; display: none; }
    .incident.expanded .incident-detail { display: block; }
    .incident-time { font-size: 0.75rem; color: var(--text3); white-space: nowrap; }

    .incident-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
    .incident:hover .incident-actions { opacity: 1; }
    .icon-btn { width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; color: var(--text2); }
    .icon-btn:hover { background: var(--surface); }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span>报错待办</span>
      <span class="badge" id="unreadBadge" style="display:none">0</span>
    </h1>
    <div class="actions">
      <button class="btn" onclick="loadIncidents()">刷新</button>
      <button class="btn btn-danger" onclick="clearAll()">清空全部</button>
    </div>
  </div>
  <div id="content"></div>

  <script>
    const TYPE_ICONS = {
      defense_trigger: '🛡️', plugin_error: '💥', llm_failure: '🤖',
      content_guard: '🔒', connection_issue: '📡',
    };
    const TYPE_LABELS = {
      defense_trigger: '防御触发', plugin_error: '插件报错', llm_failure: 'LLM 调用失败',
      content_guard: '内容拦截', connection_issue: '连接异常',
    };
    let incidents = [];

    async function api(method, path, body, params) {
      const bridge = window.AstrBotPluginView;
      return method === 'GET' ? bridge.apiGet(path, params) : bridge.apiPost(path, body);
    }

    async function loadIncidents() {
      try {
        const data = await api('GET', 'incidents', null, { limit: 100 });
        incidents = data.incidents || [];
        render();
      } catch (e) { console.error('Load failed:', e); }
    }

    function render() {
      const el = document.getElementById('content');
      const badge = document.getElementById('unreadBadge');
      const unread = incidents.filter(i => !i.read).length;
      if (unread > 0) { badge.textContent = unread; badge.style.display = ''; } else { badge.style.display = 'none'; }

      if (!incidents.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>没有待办事项</div></div>';
        return;
      }

      let html = '<div class="incident-list">';
      for (const inc of incidents) {
        const cls = [!inc.read ? 'unread' : ''].filter(Boolean).join(' ');
        const icon = TYPE_ICONS[inc.type] || '📋';
        const label = TYPE_LABELS[inc.type] || inc.type;
        const time = formatTime(inc.ts);
        const sev = inc.severity || 'warning';
        html += `
          <div class="incident ${cls}" id="inc-${inc.id}" onclick="toggleExpand('${inc.id}')">
            <div class="severity-bar ${sev}"></div>
            <div class="type-icon ${inc.type}">${icon}</div>
            <div class="incident-body">
              <div class="incident-title">${esc(inc.message)}</div>
              <div class="incident-meta">
                <span>${label}</span>
                <span>来源: ${esc(inc.source)}</span>
                ${inc.sender_id ? `<span>用户: ${esc(inc.sender_id)}</span>` : ''}
                ${inc.group_id ? `<span>群: ${esc(inc.group_id)}</span>` : ''}
              </div>
              ${inc.detail ? `<div class="incident-detail">${esc(inc.detail)}</div>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
              <div class="incident-time">${time}</div>
              <div class="incident-actions">
                ${!inc.read ? `<button class="icon-btn" title="标为已读" onclick="event.stopPropagation();markRead('${inc.id}')">✓</button>` : ''}
                <button class="icon-btn" title="删除" onclick="event.stopPropagation();deleteIncident('${inc.id}')">✕</button>
              </div>
            </div>
          </div>`;
      }
      html += '</div>';
      el.innerHTML = html;
    }

    function toggleExpand(id) {
      const el = document.getElementById('inc-' + id);
      if (el) el.classList.toggle('expanded');
    }

    async function markRead(id) {
      await api('POST', 'mark_read', { id });
      const inc = incidents.find(i => i.id === id);
      if (inc) inc.read = true;
      render();
    }

    async function deleteIncident(id) {
      await api('GET', 'clear', null, { id });
      incidents = incidents.filter(i => i.id !== id);
      render();
    }

    async function clearAll() {
      if (!confirm('确定清空所有待办？')) return;
      await api('GET', 'clear_all');
      incidents = [];
      render();
    }

    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    loadIncidents();
    setInterval(loadIncidents, 30000);
  </script>
</body>
</html>
